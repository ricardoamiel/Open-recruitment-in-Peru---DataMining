<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La red de compras públicas</title>
<meta name="description" content="Presentación del Proyecto Integrador 2: grafos, clustering, recomendación y representación sobre las contrataciones públicas del Perú.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*ESTILOS*/
html, body { height: 100%; overflow: hidden; }
body { background: #E6ECF0; }
:root[data-theme="dark"] body { background: #070A0C; }
.mazo { position: fixed; inset: 0; display: grid; place-items: center; }
.diapo {
  position: absolute; width: 1600px; height: 900px; background: var(--fondo);
  padding: 64px 84px 70px; display: flex; flex-direction: column;
  opacity: 0; transform: translateX(60px); transition: opacity .55s ease, transform .55s ease;
  pointer-events: none; overflow: hidden; transform-origin: center;
}
.diapo.activa { opacity: 1; transform: none; pointer-events: auto; }
.diapo.previa { transform: translateX(-60px); }
.diapo h1 { font-size: 64px; line-height: 1.05; margin: 0 0 18px; }
.diapo h2 { font-size: 46px; line-height: 1.1; margin: 0 0 8px; }
.diapo .bajada { font-size: 25px; color: var(--tinta2); margin: 0 0 22px; max-width: 1350px; line-height: 1.35; }
.diapo p, .diapo li { font-size: 24px; line-height: 1.4; }
.diapo .grafico text { font-size: 15px; }
.diapo .control { font-size: 19px; }
.diapo .control input[type=range] { width: 260px; }
.diapo .cifra .n { font-size: 46px; }
.diapo .cifra .t { font-size: 17px; }
.diapo .chip { font-size: 17px; padding: 7px 16px; }
.etiqueta-parte {
  position: absolute; top: 26px; left: 84px; font: 600 15px var(--texto); letter-spacing: .08em;
  text-transform: uppercase; color: var(--utec-oscuro);
}
.pie {
  position: absolute; bottom: 22px; left: 84px; right: 84px; display: flex; justify-content: space-between;
  font-size: 14px; color: var(--tinta3);
}
.pie .marca { font-family: var(--titulo); font-weight: 700; color: var(--tinta); }
.pie .marca span { color: var(--utec-oscuro); }
.barra-utec { position: absolute; left: 0; top: 0; height: 8px; width: 100%; background: var(--utec); }
.portada { background: var(--utec); color: #00121A; justify-content: center; }
.portada h1 { font-size: 78px; max-width: 1150px; color: #00121A; }
.portada .bajada { color: #003349; font-size: 28px; }
.portada .mas { position: absolute; right: 150px; top: 230px; width: 190px; height: 190px; }
.portada .mas::before, .portada .mas::after { content: ""; position: absolute; background: var(--acento); border-radius: 6px; }
.portada .mas::before { left: 65px; top: 0; width: 60px; height: 190px; }
.portada .mas::after { left: 0; top: 65px; width: 190px; height: 60px; }
.portada .equipo { font-size: 22px; margin-top: 40px; color: #003349; }
.portada .equipo b { color: #00121A; }
.cuerpo { flex: 1; display: grid; gap: 28px; min-height: 0; align-content: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.diapo table.datos { font-size: 16px; }
.diapo table.datos th { font-size: 14px; }
.diapo table.datos td, .diapo table.datos th { padding: 5px 8px; }
.diapo .mini { line-height: 1.3; font: 700 14px var(--texto); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta3); margin: 0 0 6px; }
.franja { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.franja .cifra .n { font-size: 36px; }
.franja .cifra .t { font-size: 15px; }
.diapo table.datos.preguntas td { font-size: 22px; padding: 26px 10px; vertical-align: middle; color: var(--tinta2); }
.preguntas .tenue { color: var(--tinta3); font-size: 17px; }
.dos { grid-template-columns: 1.35fr 1fr; align-items: start; }
.dos-iguales { grid-template-columns: 1fr 1fr; align-items: start; }
.lectura { font-size: 22px; line-height: 1.45; color: var(--tinta2); }
.lectura b { color: var(--tinta); }
.negocio {
  border-left: 6px solid var(--acento); background: var(--panel); padding: 16px 22px; border-radius: 0 10px 10px 0;
  font-size: 21px; line-height: 1.45;
}
.negocio .k { font: 700 14px var(--texto); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta3); display: block; margin-bottom: 4px; }
.paso { opacity: 0; transform: translateY(14px); transition: opacity .45s, transform .45s; }
.paso.visible { opacity: 1; transform: none; }
.lista { margin: 0; padding-left: 28px; }
.lista li { margin-bottom: 12px; }
.lista li::marker { color: var(--utec-oscuro); font-weight: 700; }
.progreso { position: fixed; left: 0; bottom: 0; height: 4px; background: var(--utec); transition: width .4s; z-index: 5; }
.ayuda { position: fixed; right: 14px; bottom: 10px; color: #6B747E; font: 12px var(--texto); z-index: 5; }
.pregunta-grande { font-family: var(--titulo); font-size: 34px; line-height: 1.3; color: var(--tinta); }
.pregunta-grande .num { color: var(--utec-oscuro); margin-right: 12px; }
</style>
</head>
<body>
<div class="mazo" id="mazo">
<!--DIAPOSITIVAS-->
</div>
<div class="progreso" id="progreso"></div>
<div class="ayuda">flechas para avanzar · F pantalla completa · T tema</div>
<script>/*D3*/</script>
<script>
/*DATOS*/
/*GRAFICOS*/
/*MODULOS*/

// Motor de la presentación. Cada diapositiva puede tener pasos (.paso) que se
// revelan uno por uno, y un atributo data-modulo con el nombre del módulo que
// dibuja su gráfico; el gráfico se dibuja al entrar, para que la animación se vea.
(() => {
  const diapos = [...document.querySelectorAll(".diapo")];
  let i = 0, paso = 0;
  const dibujadas = new Set();
  function escalar() {
    const s = Math.min(innerWidth / 1600, innerHeight / 900);
    diapos.forEach((d) => (d.style.transform = d.classList.contains("activa") ? `scale(${s})` : `scale(${s}) translateX(${d.classList.contains("previa") ? -60 : 60}px)`));
  }
  function mostrar(n, alFinal = false) {
    i = Math.max(0, Math.min(diapos.length - 1, n));
    diapos.forEach((d, k) => { d.classList.toggle("activa", k === i); d.classList.toggle("previa", k < i); });
    const pasos = diapos[i].querySelectorAll(".paso");
    paso = alFinal ? pasos.length : 0;
    pasos.forEach((p, k) => p.classList.toggle("visible", k < paso));
    const mod = diapos[i].dataset.modulo;
    if (!dibujadas.has(i)) {
      dibujadas.add(i);
      const d = diapos[i], o = { modo: "presentacion", raiz: d, lateral: d.querySelector("[data-lateral]") };
      setTimeout(() => {
        if (mod && MODULOS[mod]) MODULOS[mod](d.querySelector("[data-grafico]") || d, o);
        // Módulos secundarios: evidencia que llena la diapositiva con la misma fuente de datos.
        d.querySelectorAll("[data-extra]").forEach((el) => MODULOS[el.dataset.extra]?.(el, { ...o, compacto: true }));
      }, 250);
    }
    document.getElementById("progreso").style.width = `${100 * (i + 1) / diapos.length}%`;
    history.replaceState(null, "", "#" + (i + 1));
    escalar();
  }
  function avanzar() {
    const pasos = diapos[i].querySelectorAll(".paso");
    if (paso < pasos.length) { pasos[paso++].classList.add("visible"); return; }
    if (i < diapos.length - 1) mostrar(i + 1);
  }
  function retroceder() {
    const pasos = diapos[i].querySelectorAll(".paso");
    if (paso > 0) { pasos[--paso].classList.remove("visible"); return; }
    if (i > 0) mostrar(i - 1, true);
  }
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); avanzar(); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); retroceder(); }
    if (e.key === "Home") mostrar(0);
    if (e.key === "End") mostrar(diapos.length - 1);
    if (e.key === "f" || e.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (e.key === "t" || e.key === "T") {
      const r = document.documentElement, oscuro = r.getAttribute("data-theme") === "dark";
      r.setAttribute("data-theme", oscuro ? "light" : "dark");
      dibujadas.clear(); mostrar(i, true);
    }
  });
  document.getElementById("mazo").addEventListener("click", (e) => {
    if (e.target.closest("input, button, .grafico, a")) return;
    e.clientX > innerWidth / 3 ? avanzar() : retroceder();
  });
  addEventListener("resize", escalar);
  mostrar((parseInt(location.hash.slice(1)) || 1) - 1);
})();
</script>
</body>
</html>
